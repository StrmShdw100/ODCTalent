<div class="login-container">
  <div class="panneaugauche">
    <div class="entetegauche">
      <img src="logoODC.png" alt="ODC Logo" class="logo" id="logogauche" />
    </div>

  </div>

  <div class="panneaudroit">
    <div class="formulaireconteneur">
      <div class="formulaireentete">
        <h3>Bienvenue...</h3>
        <p>Connectez-vous à votre espace administrateur</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="input-group">
          <label for="email">Adresse e-mail</label>
          <div class="input-field">
            <img src="/icones/enveloppe.png">
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              placeholder="orangekalanso@odctalent.com" />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Mot de passe</label>
          <div class="input-field">
            <img src="/icones/ouvrir.png">
           <input 
              [type]="showPassword ? 'text' : 'password'"
              id="password" 
              formControlName="password" 
              placeholder="Entrez votre mot de passe" />
            <img src="/icones/oeil.png" alt="Afficher/Cacher" (click)="togglePasswordVisibility()" style="cursor: pointer;" />
          </div>
        </div>

        <div class="form-actions-row">
          <label class="remember-me">
            <input type="checkbox" formControlName="rememberMe" /> Se souvenir de moi
          </label>
          <a href="#" class="forgot-password">Mot de passe oublié ?</a>
        </div>

        <div *ngIf="errorMessage" class="error-alert" style="color: #ff3333; background-color: #ffe6e6; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 13px; text-align: center; border: 1px solid #ff9999;">
          ⚠️ {{ errorMessage }}
        </div>

<button type="submit" class="btn-submit">
  Se connecter
</button>

        <div class="form-footer-note">
          <p><img src="/icones/cadenas.png"> Accès réservé aux administrateurs autorisés.</p>
        </div>
      </form>
    </div>
  </div>
</div>
