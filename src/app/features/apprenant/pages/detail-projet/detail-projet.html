<div class="conteneur-page">
  <div class="en-tete-page">
    <div>
      <a routerLink="/apprenant/projets" class="lien-retour">← Retour à mes projets</a>
      <h1 class="titre-principal">Modifier le projet</h1>
      <p class="sous-titre-principal">Mettez à jour les informations et les liens de votre réalisation.</p>
    </div>
    <button class="bouton-supprimer" (click)="supprimerProjet()">Supprimer le projet</button>
  </div>

  <div class="formulaire-edition-carte">
    <div class="apercu-container">
      <img *ngIf="projet.imageUrl" [src]="projet.imageUrl" [alt]="projet.titre" class="apercu-img" />
      <div *ngIf="!projet.imageUrl" class="apercu-fallback">
        <img [src]="getTechIcon(projet.technologies)" alt="icone" class="tech-icon-img" />
        <span>{{ projet.technologies || 'Aperçu du projet' }}</span>
      </div>
    </div>

    <div class="corps-formulaire">
      <div class="groupe-f">
        <label class="lab">Titre du projet *</label>
        <input type="text" class="inp" [(ngModel)]="projet.titre" />
      </div>

      <div class="groupe-f">
        <label class="lab">Description complète *</label>
        <textarea class="inp" rows="5" [(ngModel)]="projet.description"></textarea>
      </div>

      <div class="groupe-f">
        <label class="lab">Technologies utilisées</label>
        <input type="text" class="inp" [(ngModel)]="projet.technologies" />
      </div>

      <div style="background-color: #fafafa; border: 1px solid #e5e7eb; padding: 1rem; border-radius: 0.75rem; display: flex; flex-direction: column; gap: 0.75rem;">
        <label style="display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-weight: 600; color: #111827; font-size: 0.85rem;">
          <input type="checkbox" [(ngModel)]="projet.estCollaboratif" style="width: 1.1rem; height: 1.1rem; accent-color: #ff7900;" />
          Ce projet est collaboratif / Recherche des coéquipiers 👥
        </label>

        <div *ngIf="projet.estCollaboratif" style="display: flex; flex-direction: column; gap: 0.75rem; margin-top: 0.25rem; padding-top: 0.75rem; border-top: 1px dashed #d1d5db;">
          <div class="groupe-f">
            <label class="lab">Nombre de personnes recherchées</label>
            <input type="number" class="inp" [(ngModel)]="projet.nombrePersonnesRecherches" min="1" />
          </div>
          <div class="groupe-f">
            <label class="lab">Compétences recherchées (séparées par des virgules)</label>
            <input type="text" class="inp" [(ngModel)]="projet.competencesRequises" placeholder="Ex: Java, Angular, Flutter" />
          </div>
        </div>
      </div>

      <div class="groupe-f">
        <label class="lab">Lien de l'image (URL)</label>
        <input type="text" class="inp" [(ngModel)]="projet.imageUrl" />
      </div>

      <div class="ligne-form">
        <div class="groupe-f">
          <label class="lab">Lien GitHub</label>
          <input type="text" class="inp" [(ngModel)]="projet.githubUrl" />
        </div>
        <div class="groupe-f">
          <label class="lab">Lien Démo Live</label>
          <input type="text" class="inp" [(ngModel)]="projet.demoUrl" />
        </div>
      </div>

      <div class="actions-pied">
        <button class="btn-annul" routerLink="/apprenant/projets">Annuler</button>
        <button class="btn-publier" (click)="modifierProjet()">Enregistrer les modifications</button>
      </div>
    </div>
  </div>
</div>
