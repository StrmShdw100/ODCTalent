  <div class="panneaudroit">
    <div class="formulaireconteneur">
      <div class="formulaireentete">
        <!-- <h2>O<span class="slogannoir">DC</span>Talent</h2> -->
        <h3>Bienvenue...</h3>
        <p>Connectez-vous à votre espace administrateur</p>
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="input-group">
          <label for="email">Adresse e-mail</label>
          <div class="input-field">
            <img src="/icones/enveloppe.png">
            <input 
              type="email" 
              id="email" 
              formControlName="email" 
              placeholder="orangekalanso@odctalent.com" />
          </div>
        </div>

        <div class="input-group">
          <label for="password">Mot de passe</label>
          <div class="input-field">
            <img src="/icones/ouvrir.png">
            <input 
              type="password" 
              id="password" 
              formControlName="password" 
              placeholder="Entrez votre mot de passe" />
            <img src="/icones/oeil.png">
          </div>
        </div>

        <div class="form-actions-row">
          <label class="remember-me">
            <input type="checkbox" formControlName="rememberMe" /> Se souvenir de moi
          </label>
          <a href="#" class="forgot-password">Mot de passe oublié ?</a>
        </div>

        <button type="submit" class="btn-submit" [disabled]="loginForm.invalid">
          Se connecter
        </button>

        <div class="form-footer-note">
          <p><img src="/icones/cadenas.png"> Accès réservé aux administrateurs autorisés.</p>
        </div>
      </form>
    </div>
  </div>
</div>
