<div class="conteneur-entreprise">
  <!-- En-tête -->
  <div class="en-tete-entreprise">
    <span class="texte-logo"><span class="mise-en-evidence">ODC</span>Talent</span>
  </div>

  <!-- Titre Principal -->
  <div class="en-tete-titre">
    <h1 class="titre-principal">Profil de l'entreprise[cite: 5]</h1>
    <p class="sous-titre-principal">Présentez votre entreprise aux talents de la plate-forme.[cite: 5]</p>
  </div>

  <!-- Carte Formulaire -->
  <div class="carte-formulaire-entreprise">
    <form class="formulaire-entreprise">
      
      <!-- Logo et Nom -->
      <div class="ligne-formulaire">
        <div class="groupe-champ">
          <label class="libelle-champ">Logo de l'entreprise[cite: 5]</label>
          <div class="zone-upload">
            <div class="cercle-plus">+</div>
            <span class="texte-upload">PNG, JPG &bull; 2 Mo max.[cite: 5]</span>
          </div>
        </div>

        <div class="colonne-droite-champs">
          <div class="groupe-champ">
            <label class="libelle-champ">Nom de l'entreprise <span class="etoile">*</span>[cite: 5]</label>
            <input type="text" class="champ-saisie" placeholder="Ex. Orange Mali[cite: 5]" />
          </div>
          <div class="groupe-champ">
            <label class="libelle-champ">Secteur d'activité <span class="etoile">*</span>[cite: 5]</label>
            <input type="text" class="champ-saisie" placeholder="Ex. Technologie[cite: 5]" />
          </div>
        </div>
      </div>

      <!-- Lieu et Adresse -->
      <div class="ligne-formulaire">
        <div class="groupe-champ">
          <label class="libelle-champ">Lieu de l'entreprise <span class="etoile">*</span>[cite: 5]</label>
          <input type="text" class="champ-saisie" placeholder="Bamako, Mali[cite: 5]" />
        </div>
        <div class="groupe-champ">
          <label class="libelle-champ">Adresse complète[cite: 5]</label>
          <input type="text" class="champ-saisie" placeholder="Ex. ACI 2000, Bamako[cite: 5]" />
        </div>
      </div>

      <!-- Description -->
      <div class="groupe-champ">
        <label class="libelle-champ">Description de l'entreprise <span class="etoile">*</span>[cite: 5]</label>
        <textarea class="zone-texte" rows="4" placeholder="Présentez brièvement votre entreprise, son activité et ses domaines...[cite: 5]"></textarea>
        <span class="compteur-caracteres">0 / 500[cite: 5]</span>
      </div>

      <!-- Site web et LinkedIn -->
      <div class="ligne-formulaire">
        <div class="groupe-champ">
          <label class="libelle-champ">Site web[cite: 5]</label>
          <input type="text" class="champ-saisie" placeholder="https://www.exemple.com[cite: 5]" />
        </div>
        <div class="groupe-champ">
          <label class="libelle-champ">LinkedIn <span class="facultatif">(facultatif)</span>[cite: 5]</label>
          <input type="text" class="champ-saisie" placeholder="Lien vers votre page LinkedIn[cite: 5]" />
        </div>
      </div>

      <!-- Boutons d'action bas de page -->
      <div class="actions-formulaire">
        <button type="button" class="bouton-annuler">Annuler[cite: 5]</button>
        <button type="submit" class="bouton-enregistrer">Enregistrer[cite: 5]</button>
      </div>

    </form>
  </div>
</div>
