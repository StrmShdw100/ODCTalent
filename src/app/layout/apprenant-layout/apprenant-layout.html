<div class="conteneur-layout">
  <aside class="barre-laterale">
    <div class="logo-conteneur">
      <div class="logo-cercle">
        <img src="/logoODC.png" alt="logo">
      </div>
    </div>

    <nav class="navigation-menu">
      <a routerLink="/apprenant/tableau-de-bord" routerLinkActive="lien-actif" class="lien-menu">
        <span class="icone-menu"><img src="/icones/dashboard.png" alt="icone-tableau-de-bord"></span> Tableau de bord
      </a>
      <a routerLink="/apprenant/projets" routerLinkActive="lien-actif" class="lien-menu">
        <span class="icone-menu"><img src="/icones/briefcase.png" alt="icone-projets"></span> Mes Projets
      </a>

      <a routerLink="/apprenant/evolution-pro" routerLinkActive="lien-actif" class="lien-menu">
        <span class="icone-menu"><img src="/icones/diagram.png" alt="icone-evolution-pro"></span> Évolution Pro
      </a>

      <a routerLink="/apprenant/opportunites" routerLinkActive="lien-actif" class="lien-menu">
        <span class="icone-menu"><img src="/icones/opportinuty.png" alt="icone-opportunites"></span> Opportunités
      </a>

      <a routerLink="/apprenant/actualites" routerLinkActive="lien-actif" class="lien-menu">
        <span class="icone-menu"><img src="/icones/megaphone.png" alt="icone-actualites"></span> Actualités
      </a>

      <a routerLink="/apprenant/notifications" routerLinkActive="lien-actif" class="lien-menu">
        <span class="icone-menu"><img src="/icones/love-bell.png" alt="icone-alert"></span> 
        Notifications
        <span class="badge-notif-menu" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </a>
      <a routerLink="/apprenant/portfolio" routerLinkActive="lien-actif" class="lien-menu">
        <span class="icone-menu"><img src="/icones/portfolio.png" alt="icone-portfolio"></span> Mon Portfolio
      </a>
    </nav>
  </aside>

  <!-- Zone Principale -->
  <div class="zone-principale">
    <header class="en-tete">
      <span class="titre-espace">Espace Apprenant / Talents</span>

      <div class="elements-droite-header">
        <div class="boite-recherche">
          <span class="icone-recherche"><img src="icones/search.png" alt="icones recherche"></span>
          <input type="text" class="champ-recherche" placeholder="Rechercher..." />
        </div>

        <!-- Cloche de notification -->
        <a routerLink="/apprenant/notifications" class="notification-badge">
          <span class="badge-chiffre" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
          <img src="/icones/love-bell.png" alt="icone-notification">
        </a>

        <!-- 🚀 Profil Utilisateur cliquable avec Menu Déroulant -->
        <div class="profil-wrapper" (click)="toggleDropdown($event)">
          <div class="profil-utilisateur">
            <div class="avatar-cercle">{{ nom.charAt(0).toUpperCase() }}</div>
            <div class="infos-utilisateur">
              <span class="nom-utilisateur">{{ nom }}</span>
              <span class="role-utilisateur">{{ role }}</span>
            </div>
            <span class="fleche-dropdown">▼</span>
          </div>

          <!-- Menu déroulant -->
          <div class="menu-deroulant" *ngIf="showDropdown">
            <a routerLink="/apprenant/portfolio" class="item-dropdown">
              <span>⚙️</span> Paramètres / Profil
            </a>
            <div class="separateur-dropdown"></div>
            <button (click)="deconnecter()" class="item-dropdown deconnexion">
              <span><img src="/icones/power-off.png" alt="deconnexion" width="16"></span> Déconnexion
            </button>
          </div>
        </div>

      </div>
    </header>

    <main class="contenu-dynamique">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
