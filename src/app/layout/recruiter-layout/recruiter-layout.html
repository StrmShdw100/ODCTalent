<div class="admin-dashboard-container">
  <!-- SIDEBAR (Menu latéral) -->
  <aside class="sidebar">
    <div class="sidebar-logo-container">
      <img src="logoODC.png" alt="Logo ODC" id="logo">
    </div>

    <nav class="sidebar-nav">
      <a routerLink="/recruteur/tableau-de-bord" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" class="nav-item">
        <img src="icones/dashboard.png" alt="" class="nav-icon"> Tableau de bord
      </a>
      <a routerLink="/recruteur/missions" routerLinkActive="active" class="nav-item">
        <img src="icones/target.png" alt="Missions" class="nav-icon"> Missions
      </a>
      <a routerLink="/recruteur/candidatures" routerLinkActive="active" class="nav-item">
        <img src="icones/apprenants-fill.png" alt="Candidatures" class="nav-icon"> Candidatures
      </a>
      <a routerLink="/recruteur/contrats" routerLinkActive="active" class="nav-item">
        <img src="icones/contract.png" alt="Contrats" class="nav-icon"> Contrats
      </a>
      <!-- L'onglet Notifications ajouté dans l'aside -->
      <a routerLink="/recruteur/notifications" routerLinkActive="active" class="nav-item notifications-nav-item">
        <img src="icones/love-bell.png" alt="Notifications" class="nav-icon"> Notifications
        <span class="sidebar-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
      </a>
      <a routerLink="/recruteur/parametres" routerLinkActive="active" class="nav-item">
        <img src="icones/setting.png" alt="Paramètres" class="nav-icon"> Paramètres
      </a>
    </nav>

    <div class="sidebar-footer">
      <button (click)="deconnecter()" class="btn-logout">
        <img src="icones/power-off.png" alt="" class="logodeconnexion"> Déconnexion
      </button>
    </div>
  </aside>

  <!-- CONTENU PRINCIPAL -->
  <div class="main-content-wrapper">
    <!-- TOPBAR (En-tête) -->
    <header class="topbar">
      <div class="search-box">
        <input type="text" placeholder="Rechercher..." />
      </div>
      <div class="admin-profile-info">
        <button class="notification-btn" title="Notifications" routerLink="/recruteur/notifications">
          <img src="icones/love-bell.png" alt="Notif" style="width: 18px; height: 18px;">
          <span class="notification-badge" *ngIf="unreadCount > 0">{{ unreadCount }}</span>
        </button>

        <div class="avatar-badge">
          {{ recruteurName.charAt(0).toUpperCase() }}
        </div>
        <div class="admin-details">
          <span class="admin-name">{{ recruteurName }}</span>
          <span class="admin-role">{{ recruteurRole }}</span>
        </div>
      </div>
    </header>

    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
